[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cjhx-agile-workflow"
version = "0.1.0"
description = "Skill-driven Agentic SDLC framework for CJHX Agile Workflow"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "CJHX" }]
dependencies = []

[project.scripts]
cjhx = "cjhx_agile_workflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
